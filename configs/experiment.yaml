# ============================================================
#  PAC vs DP  -  ICL aggregation experiment config
# ============================================================

# --- Dataset ---
dataset:
  name: sst2           # sst2 | ag_news | yelp_polarity
  num_test: 200        # Number of evaluation samples
  seed: 42

# --- Teacher settings ---
teachers:
  num_teachers: 10     # Number of teachers k
  shots_per_teacher: 4 # ICL examples per teacher

# --- LLM settings ---
model:
  name: "ollama:llama3.1:8b"   # Small model that can run locally
  # Or use Ollama: "ollama:llama3.2:1b"
  device: "cpu"        # cpu | cuda | mps (Apple Silicon)
  max_new_tokens: 8
  batch_size: 4

# --- DP aggregation baseline ---
dp:
  epsilon: 1.0
  delta: 1.0e-5
  mechanism: gaussian  # gaussian | laplace

# --- PAC aggregation ---
pac:
  eta: 0.5             # Target mutual-information upper bound (nats)
  delta: 1.0e-5
  mc_samples: 500      # Number of Monte Carlo samples
  sigma_search:
    low: 0.01
    high: 30.0
    tol: 0.05          # Binary search tolerance

# --- Experiment output ---
output:
  results_dir: results/
  save_votes: true     # Save raw votes for reproducibility
